# Programs for Hydrogen. A workspace of its own, built from inside this folder with its own
# settings (`.cargo/config.toml`): user programs are linked differently from the kernel.
[workspace]
resolver = "3"
members = ["libhydrogen", "apps"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
