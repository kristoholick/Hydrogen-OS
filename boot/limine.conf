# Limine boot menu for Hydrogen. Placed at /boot/limine/limine.conf inside the ISO.
timeout: 0

/Hydrogen
    protocol: limine
    path: boot():/boot/hydrogen-kernel
    module_path: boot():/boot/apps/hello-a
    module_path: boot():/boot/apps/hello-b
    module_path: boot():/boot/apps/memory-check
    module_path: boot():/boot/apps/crash-test
    module_path: boot():/boot/apps/abuse-test
