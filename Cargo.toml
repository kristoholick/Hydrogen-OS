[workspace]
resolver = "3"
members = ["kernel", "crates/hydrogen-mm", "crates/hydrogen-elf", "crates/hydrogen-acpi", "crates/hydrogen-pci"]
exclude = ["userspace"]
default-members = ["kernel"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true      # keep symbols for GDB and panic backtraces later
